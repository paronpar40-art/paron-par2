version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: armored_postgres
    environment:
      POSTGRES_DB: armored_unit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MilitaryPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/PostgreSQL/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./Database/PostgreSQL/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    restart: always

  backend-api:
    build:
      context: ./Backend
      dockerfile: ../Dockerfile
    container_name: armored_backend_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=armored_unit_db;Username=postgres;Password=MilitaryPassword2026!
      - JWT__Secret=ArmoredUnitSuperSecretKey2026MustBeAtLeast32BytesLong!
    ports:
      - "5000:80"
    depends_on:
      - postgres
    restart: always

  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: armored_web_dashboard
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    restart: always

volumes:
  postgres_data:
